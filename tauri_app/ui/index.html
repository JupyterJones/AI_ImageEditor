<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EsperanzaAI Image Editor</title>
    <meta http-equiv="refresh" content="0; url=http://127.0.0.1:5000">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0b0f17;
            color: #f3f4f6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            flex-direction: column;
            text-align: center;
        }
        .loader-card {
            background: rgba(17, 24, 39, 0.85);
            border: 1px solid rgba(236, 72, 153, 0.3);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(236, 72, 153, 0.15);
            max-width: 440px;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #1f2937;
            border-top: 4px solid #ec4899;
            border-radius: 50%;
            animation: spin 0.9s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite;
            margin: 0 auto 24px auto;
        }
        h2 { font-size: 1.4rem; font-weight: 700; color: #fff; margin-bottom: 8px; }
        p { font-size: 0.9rem; color: #9ca3af; line-height: 1.4; }
        .badge {
            margin-top: 18px;
            display: inline-block;
            font-size: 0.75rem;
            color: #f472b6;
            background: rgba(236, 72, 153, 0.12);
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid rgba(236, 72, 153, 0.25);
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="loader-card">
        <div class="spinner"></div>
        <h2>EsperanzaAI Image Editor</h2>
        <p>Connecting to local darkroom engine on port 5000...</p>
        <div class="badge">🌸 Initializing Dual-Layer Canvas & AI Pipelines</div>
    </div>
    <script>
        // Automatic retry loop in case Flask is still warming up
        function checkReady() {
            fetch("http://127.0.0.1:5000/api/status")
                .then(res => {
                    if (res.ok) window.location.href = "http://127.0.0.1:5000";
                    else setTimeout(checkReady, 500);
                })
                .catch(() => setTimeout(checkReady, 500));
        }
        checkReady();
    </script>
</body>
</html>
